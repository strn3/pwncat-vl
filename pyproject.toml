[project]
name = "pwncat-vl"
version = "0.7.0"
description = "Community-maintained fork of pwncat with Python 3.13+ support"
authors = [
    { name = "Chocapikk", email = "balgogan@protonmail.com" },
    { name = "Caleb Stewart", email = "caleb.stewart94@gmail.com" },
    { name = "John Hammond" },
]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "offsec",
    "cyber",
    "exploitation",
    "privesc",
    "automation",
    "redteam",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "psutil>=6.0,<7",
    "packaging>=23.0,<26",
    "libpass>=1.9,<2",
    "prompt-toolkit>=3.0.19,<4",
    "requests>=2.32,<3",
    "rich>=10.4,<14",
    "ZODB3>=3.11,<4",
    "Jinja2>=3.1,<4",
    "paramiko-ng>=2.9,<2.10",
    "cryptography>=43.0,<43.1",
    "pygments>=2.0,<3",
]

[project.optional-dependencies]
docs = [
    "sphinx-toolbox>=3.8,<4",
    "Sphinx>=7.4,<8",
    "enum-tools>=0.12,<0.13",
    "furo>=2024.0",
]

[project.urls]
Repository = "https://github.com/Chocapikk/pwncat-vl"
Documentation = "https://pwncat.readthedocs.io"
"Bug Tracker" = "https://github.com/Chocapikk/pwncat-vl/issues"

[project.scripts]
pwncat-vl = "pwncat.__main__:main"

[dependency-groups]
dev = [
    "isort>=5.13,<6",
    "pytest>=8.0,<9",
    "flake8>=7.0,<8",
    "ruff>=0.7,<0.8",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = "-v"

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["pwncat"]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
